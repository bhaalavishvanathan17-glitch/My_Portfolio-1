<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhaala | Login</title>
    <meta name="description" content="Login or Register to access Bhaala Vishvanathan's Portfolio.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ── Reset & Base ── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
            position: relative;
        }

        /* ── Background Video ── */
        #bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.25;
            filter: brightness(0.5) saturate(1.4);
        }

        /* ── Animated gradient overlay ── */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(10,10,10,0.88) 0%,
                rgba(26,5,5,0.82) 50%,
                rgba(10,10,10,0.90) 100%
            );
            z-index: 1;
        }

        /* ── Floating blobs ── */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            animation: blobFloat 12s ease-in-out infinite alternate;
            z-index: 1;
        }
        .blob-1 { width: 420px; height: 420px; background: #ff512f; top: -80px; left: -80px; animation-duration: 10s; }
        .blob-2 { width: 360px; height: 360px; background: #dd2476; bottom: -80px; right: -80px; animation-duration: 14s; }
        .blob-3 { width: 280px; height: 280px; background: #ffd369; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-duration: 16s; }

        @keyframes blobFloat {
            from { transform: translateY(0) scale(1); }
            to   { transform: translateY(30px) scale(1.06); }
        }

        /* ── Card ── */
        .card-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 80, 80, 0.18);
            border-radius: 24px;
            padding: 44px 40px 40px;
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow:
                0 8px 40px rgba(0,0,0,0.55),
                0 0 0 1px rgba(255,255,255,0.04) inset;
            animation: cardIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(28px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Logo / Brand ── */
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(90deg, #f25050, #ffd369);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            display: block;
            margin-bottom: 4px;
        }

        .brand-tagline {
            font-size: 13px;
            color: rgba(255,255,255,0.45);
            letter-spacing: 0.5px;
        }

        /* ── Tab Switcher ── */
        .tabs {
            display: flex;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.5);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 0;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.4px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #f25050, #dd2476);
            color: #fff;
            box-shadow: 0 4px 16px rgba(242,80,80,0.35);
        }

        /* ── Forms ── */
        .form-section { display: none; }
        .form-section.active { display: block; }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 13px 16px;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .form-group input:focus {
            border-color: rgba(242, 80, 80, 0.6);
            background: rgba(255,255,255,0.09);
            box-shadow: 0 0 0 3px rgba(242,80,80,0.12);
        }

        /* ── Submit Button ── */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f25050 0%, #dd2476 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(242,80,80,0.35);
            position: relative;
            overflow: hidden;
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0);
            transition: background 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(242,80,80,0.5);
        }

        .btn-submit:active { transform: translateY(0); }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Message Box ── */
        .msg-box {
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13.5px;
            font-weight: 500;
            text-align: center;
            margin-top: 16px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .msg-box.success {
            display: block;
            background: rgba(52, 211, 153, 0.12);
            border: 1px solid rgba(52,211,153,0.35);
            color: #6ee7b7;
        }

        .msg-box.error {
            display: block;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.35);
            color: #fca5a5;
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0 20px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }
        .divider span {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            white-space: nowrap;
        }

        /* ── Footer link ── */
        .back-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: rgba(255,255,255,0.35);
        }

        .back-link a {
            color: #f87171;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link a:hover { color: #fca5a5; }

        /* ── Spinner ── */
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .card { padding: 32px 24px 28px; }
            .card-wrapper { padding: 16px; }
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="Login background video 1.mp4" type="video/mp4">
    </video>

    <!-- Overlays -->
    <div class="bg-overlay"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Card -->
    <div class="card-wrapper">
        <div class="card">

            <!-- Brand -->
            <div class="brand">
                <span class="brand-logo">BV</span>
                <p class="brand-tagline">Bhaala Vishvanathan · Portfolio</p>
            </div>

            <!-- Tab Switcher -->
            <div class="tabs" role="tablist">
                <button id="tab-login" class="tab-btn active" onclick="switchTab('login')" role="tab" aria-selected="true">Login</button>
                <button id="tab-register" class="tab-btn" onclick="switchTab('register')" role="tab" aria-selected="false">Register</button>
            </div>

            <!-- ── LOGIN FORM ── -->
            <div id="section-login" class="form-section active">
                <form id="login-form" onsubmit="handleLogin(event)" novalidate>
                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-submit" id="login-btn">Login →</button>
                </form>
                <div class="msg-box" id="login-msg"></div>
                <div class="divider"><span>Don't have an account?</span></div>
                <p class="back-link"><a href="#" onclick="switchTab('register'); return false;">Create a free account</a></p>
            </div>

            <!-- ── REGISTER FORM ── -->
            <div id="section-register" class="form-section">
                <form id="register-form" onsubmit="handleRegister(event)" novalidate>
                    <div class="form-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" placeholder="Your full name" required autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="reg-phone">Phone Number</label>
                        <input type="tel" id="reg-phone" placeholder="+91 XXXXX XXXXX" required autocomplete="tel">
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" placeholder="Min. 6 characters" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-submit" id="register-btn">Create Account →</button>
                </form>
                <div class="msg-box" id="register-msg"></div>
                <div class="divider"><span>Already have an account?</span></div>
                <p class="back-link"><a href="#" onclick="switchTab('login'); return false;">Sign in instead</a></p>
            </div>

        </div>
    </div>

    <script>
        /* ── Tab Switcher ── */
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('tab-' + tab).setAttribute('aria-selected','true');
            document.getElementById('section-' + tab).classList.add('active');
            clearMsg('login-msg');
            clearMsg('register-msg');
        }

        function showMsg(id, text, type) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = 'msg-box ' + type;
        }

        function clearMsg(id) {
            const el = document.getElementById(id);
            el.textContent = '';
            el.className = 'msg-box';
        }

        function setLoading(btnId, loading, label) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.innerHTML = loading ? '<span class="spinner"></span> Please wait…' : label;
        }

        /* ── Login Handler ── */
        async function handleLogin(e) {
            e.preventDefault();
            const email    = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                showMsg('login-msg', '⚠️ Please fill in all fields.', 'error');
                return;
            }

            setLoading('login-btn', true, 'Login →');
            clearMsg('login-msg');

            try {
                const res  = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    showMsg('login-msg', '✅ ' + data.message, 'success');
                    sessionStorage.setItem('bhaala_logged_in', 'true');
                    sessionStorage.setItem('bhaala_user', data.name || email);
                    setTimeout(() => { window.location.href = 'Bhaala.html'; }, 1200);
                } else {
                    showMsg('login-msg', '❌ ' + data.message, 'error');
                }
            } catch (err) {
                showMsg('login-msg', '❌ Cannot connect to server. Make sure it is running.', 'error');
            } finally {
                setLoading('login-btn', false, 'Login →');
            }
        }

        /* ── Register Handler ── */
        async function handleRegister(e) {
            e.preventDefault();
            const name     = document.getElementById('reg-name').value.trim();
            const email    = document.getElementById('reg-email').value.trim();
            const phone    = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;

            if (!name || !email || !phone || !password) {
                showMsg('register-msg', '⚠️ Please fill in all fields.', 'error');
                return;
            }
            if (password.length < 6) {
                showMsg('register-msg', '⚠️ Password must be at least 6 characters.', 'error');
                return;
            }

            setLoading('register-btn', true, 'Create Account →');
            clearMsg('register-msg');

            try {
                const res  = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, phone })
                });
                const data = await res.json();

                if (data.success) {
                    showMsg('register-msg', '✅ ' + data.message, 'success');
                    document.getElementById('register-form').reset();
                    setTimeout(() => { switchTab('login'); }, 2000);
                } else {
                    showMsg('register-msg', '❌ ' + data.message, 'error');
                }
            } catch (err) {
                showMsg('register-msg', '❌ Cannot connect to server. Make sure it is running.', 'error');
            } finally {
                setLoading('register-btn', false, 'Create Account →');
            }
        }
    </script>

</body>
</html>
