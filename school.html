<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Session Guard: redirect to login if not authenticated -->
    <script>
        if (!localStorage.getItem('bhaala_logged_in') && !sessionStorage.getItem('bhaala_logged_in')) {
            window.location.replace('login.html');
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My School</title>
    <link rel="stylesheet" href="Bhaala.css">
</head>

<body>

    <nav class="navbar">
        <a href="Bhaala.html" class="navbar-brand">BV</a>
        <ul>
            <li><a href="Bhaala.html">Home</a></li>
            <li><a href="About Me.html">About Me</a></li>
            <li><a href="school.html" class="active">My School</a></li>
            <li><a href="college.html">My College</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html" class="nav-login-btn">Login</a></li>
        </ul>
    </nav>

    <section class="school-section">
        <div class="school-header animate-fade-up">
            <h1>My School</h1>
            <p>A look back at the institutions that built my foundational knowledge and values.</p>
        </div>

        <div class="school-container">
            <div class="school-card-v2 animate-fade-up" style="animation-delay: 0.1s;">
                <a href="https://schools.org.in/theni/33250400802/nesan-kala-pry-scl-n-tpatty.html" target="_blank">
                    <img src="Images/Nesan kala salai.webp" alt="Nesan Kala Salai">
                </a>
                <div class="school-card-body">
                    <a href="https://schools.org.in/theni/33250400802/nesan-kala-pry-scl-n-tpatty.html" target="_blank" class="school-link-badge">
                        1. Nesan Kala Salai
                    </a>
                </div>
            </div>

            <div class="school-card-v2 animate-fade-up" style="animation-delay: 0.2s;">
                <a href="https://rrinternationalschool.com/" target="_blank">
                    <img src="Images/RR International School.avif" alt="RR International School">
                </a>
                <div class="school-card-body">
                    <a href="https://rrinternationalschool.com/" target="_blank" class="school-link-badge">
                        2. RR International School
                    </a>
                </div>
            </div>

            <div class="school-card-v2 animate-fade-up" style="animation-delay: 0.3s;">
                <a href="https://www.marymathacmipublicschool.org/" target="_blank">
                    <img src="Images/Mary matha CMI public School.png" alt="Mary Matha Public School">
                </a>
                <div class="school-card-body">
                    <a href="https://www.marymathacmipublicschool.org/" target="_blank" class="school-link-badge">
                        3. Mary Matha CMI Public School
                    </a>
                </div>
            </div>

            <div class="school-card-v2 animate-fade-up" style="animation-delay: 0.4s;">
                <a href="https://www.jaytechcbseschool.com/" target="_blank">
                    <img src="Images/Jay Tech international school.jpeg" alt="Jay Tech International School">
                </a>
                <div class="school-card-body">
                    <a href="https://www.jaytechcbseschool.com/" target="_blank" class="school-link-badge">
                        4. Jay Tech International School
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Script to handle dynamic Login/Logout in navbar -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginBtn = document.querySelector('.nav-login-btn');
            if (loginBtn && (localStorage.getItem('bhaala_logged_in') || sessionStorage.getItem('bhaala_logged_in'))) {
                loginBtn.textContent = 'Logout';
                loginBtn.href = '#';
                loginBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('bhaala_logged_in');
                    localStorage.removeItem('bhaala_user');
                    sessionStorage.removeItem('bhaala_logged_in');
                    sessionStorage.removeItem('bhaala_user');
                    window.location.replace('login.html');
                });
            }
        });
    </script>
</body>
</html>
